<style>

</div></div>
<script>
/* ═══ ICE RUSH · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Top-down 3-on-3 arcade hockey: skate with momentum, carry the puck on your stick, hold to
 * charge a slap shot, pass, and body-check whoever has it. Each team has a goalie bot.
 * Versus, 2–6 players on two teams; bots fill every empty skater spot. Three periods.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ periods, rink size, skating, shots, checks, puck physics, goalies, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   RINK .......... sizes, boards with round corners, the nets, faceoff spots
 *   PHYSICS ....... skating, the puck (boards, nets, goalies), sticks, shots and passes
 *   GAME (HOST) ... teams, score, faceoffs, periods, the clock, the winner, checks. Only the host writes these.
 *   BOTS .......... skater bots (chase, carry, shoot, pass, check, get open) and the goalies
 *   ME ............ my skater, carrying, shooting, passing, checking
 *   DRAW .......... the rink seen from YOUR side (you always attack right, or up on a phone)
 *   HUD & RESULTS . scoreboard, clock, periods, messages, results card, leaderboard
 *   INPUT ......... keyboard, and a thumb stick + Shoot / Pass / Check buttons on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player skates its OWN skater on its own screen and writes it to its entity: `sk`
 *     {x, y, vx, vy, f, st, ck} (f = facing, st = stunned, ck = checking) about 15 times a second,
 *     `hb` (heartbeat) once a second, `rdy` (Play again), `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. The puck is shared, so the host owns it. Only the host writes the shared fields:
 *       `game` {id, v, phase, teams, score, ko, kickAt, resumeAt, endsAt, left, period, golden, win,
 *              overAt, goals, last}: who skates for which team (sessionIds, or bot ids "b1".."b9"), the
 *              score, the period and the clock (timestamps). `v` goes up on every write.
 *       `puck` {x, y, vx, vy, c, lt, h, w, s}: the puck ~15 times a second (c = who carries it, lt = last
 *              to touch it, h = touches so far, w = 1 waiting for the faceoff, s = write number).
 *       `bots` [{i, x, y, vx, vy, f, st, ck}]: the bot skaters and both goalies ("g0", "g1").
 *   - A loose puck that touches YOUR stick on your screen is yours at once: you send "grab"; the host
 *     says yes (it writes you as the carrier) unless someone got there first. While you carry it, it sits
 *     on your stick on every screen. Shots and passes are decided on the shooter's screen and sent as
 *     "shot" {x, y, vx, vy}; the host adopts them. A body check is decided by the checker: "check" {to};
 *     the host knocks the puck loose and tells a checked person "knock" {to, vx, vy} (it moves itself).
 *     For the shots, saves and checks it makes itself (its own, the bots', the goalies'), the host sends
 *     "fx" {k, x, y, s, by} so every screen sparks and sounds them, not only the host's.
 *   - Someone who joins takes a bot's spot on the team with fewer people, mid-game; someone who leaves
 *     is replaced by a bot. A new host adopts `game`, `puck` and `bots` and carries on.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "rush-goals": every goal you score adds 1 to your total.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  teamSize: 3,          // skaters per team (plus a goalie bot each); bots fill the spots people don't
  periods: 3,           // periods in a game; a tie after the last goes to overtime (next goal wins)
  periodMs: 60000,      // clock per period; it stops for goals and faceoffs
  faceoffMs: 1800,      // ms everyone waits on their spot before the puck drops
  goalMs: 2600,         // ms of celebration after a goal
  breakMs: 2800,        // ms between periods
  resultsMs: 10000,     // ms on the results card before the next game
  rinkL: 1400, rinkW: 640, cornerR: 170, // the rink, in rink units; round corners
  goalLine: 580,        // where each net's mouth sits, from the middle
  goalW: 124, goalDepth: 44,
  skaterR: 20, goalieR: 27, puckR: 9,
  stickReach: 36,       // how far in front of you your stick blade is
  stickR: 16,           // how big the blade's "catch" area is
  skate: 340,           // top skating speed, units/s
  accel: 950,           // how hard you push off (lower = more slippery)
  turnBrake: 1.9,       // pushing against your slide stops you this much harder
  glide: 0.7,           // how fast you slow when you stop pushing
  carrySlow: 0.9,       // share of top speed while carrying the puck
  shotMin: 620, shotMax: 1450, // a tap shot and a fully charged slap shot, units/s
  chargeMs: 850,        // ms to fully charge a shot
  passSpeed: 780,
  shotAssist: 0.8,      // how much a shot that's roughly on target bends toward the net
  puckFriction: 0.3, boardBounce: 0.72, maxPuck: 1550,
  noPickMs: 250,        // after you shoot or pass you can't pick the puck straight back up
  checkSpeed: 320,      // the burst a check gives you
  checkMs: 260, checkEvery: 1100,
  knock: 360,           // how hard a check shoves the one you hit
  stunMs: 650,          // a checked skater can't skate or pick up the puck for this long...
  stunBrake: 3,         // ...and skids to a stop this fast
  goalieSpeed: 240,     // how fast a goalie slides across
  goalieThink: 200,     // ms between a goalie's reads of the puck (slower = more goals)
  goalieError: 20,      // how far off a goalie's read is, units
  goalieHold: 650,      // ms a goalie holds a smothered puck before passing it out
  botSpeed: 0.88,       // bots skate at this share of top speed
  botThink: 160,        // ms between bot decisions
  botError: 30,         // how far off bots aim, units
  botShootRange: 420,   // bots shoot inside this distance from the net
  botPass: 0.35,        // chance a pressured bot passes instead of pushing on
  sendMs: 66,           // my skater and the puck (~15 a second)
  botsMs: 100,          // the bots (~10 a second)
  board: "rush-goals",
};
const TEAM_COLORS = ["#e23d4b", "#2d7fe0"], TEAM_DARK = ["#7d1520", "#123c78"], TEAM_NAMES = ["Red", "Blue"];
const COLORS = ["#ffd166", "#ffffff", "#7cf2c9", "#c7a2ff", "#ff9f43", "#ff8fd0", "#a6f26b", "#7fe3ff"]; // each person's own color (their helmet)
const BOT_NAMES = ["", "Biscuit", "Moose", "Grinder", "Mitts", "Bender", "Frosty", "Sauce", "Wheels", "Rocket"]; // bot "b3" is Grinder
const GOALIE_NAMES = ["Brick", "Wall"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'ice-rush',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch

// ── RINK ────────────────────────────────────────────────────────────────────────────
// Rink units: x runs -HL..HL along the rink, y runs -HW..HW across. Red (team 0) defends the -x net
// and attacks +x; Blue (team 1) the other way round.
const HL = CONFIG.rinkL / 2, HW = CONFIG.rinkW / 2, CRN = CONFIG.cornerR, GL = CONFIG.goalLine, GW = CONFIG.goalW / 2, GD = CONFIG.goalDepth;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));
/** Keep a round body d {x, y, vx, vy} of radius r inside the boards. Returns how hard it hit (0 = no hit). */
function keepInRink(d, r, bounce) {
  const ix = HL - CRN, iy = HW - CRN;
  let nx = 0, ny = 0, over = 0;
  if (Math.abs(d.x) > ix && Math.abs(d.y) > iy) { // a round corner
    const cx = Math.sign(d.x) * ix, cy = Math.sign(d.y) * iy, dx = d.x - cx, dy = d.y - cy, dist = Math.hypot(dx, dy);
    if (dist > CRN - r) { nx = dx / dist; ny = dy / dist; over = dist - (CRN - r); }
  } else if (Math.abs(d.x) > HL - r) { nx = Math.sign(d.x); over = Math.abs(d.x) - (HL - r); }
  else if (Math.abs(d.y) > HW - r) { ny = Math.sign(d.y); over = Math.abs(d.y) - (HW - r); }
  if (over <= 0) return 0;
  d.x -= nx * over; d.y -= ny * over;
  const vn = d.vx * nx + d.vy * ny;
  if (vn <= 0) return 0;
  d.vx -= (1 + bounce) * vn * nx; d.vy -= (1 + bounce) * vn * ny;
  return vn;
}
// Each net is three walls (two sides and the back); the open side faces the middle of the rink.
const NET_SEGS = [-1, 1].flatMap((sx) => [[sx * GL, -GW, sx * (GL + GD), -GW], [sx * (GL + GD), -GW, sx * (GL + GD), GW], [sx * (GL + GD), GW, sx * GL, GW]]);
/** Bounce a round body off the nets' walls (posts included). Returns how hard it hit. */
function hitNets(d, r, bounce) {
  let hit = 0;
  for (const [x1, y1, x2, y2] of NET_SEGS) {
    const ex = x2 - x1, ey = y2 - y1, t = clamp(((d.x - x1) * ex + (d.y - y1) * ey) / (ex * ex + ey * ey), 0, 1);
    const qx = x1 + ex * t, qy = y1 + ey * t, dx = d.x - qx, dy = d.y - qy, dist = Math.hypot(dx, dy);
    if (dist >= r || dist < 1e-4) continue;
    const nx = dx / dist, ny = dy / dist; d.x = qx + nx * r; d.y = qy + ny * r;
    const vn = d.vx * nx + d.vy * ny;
    if (vn < 0) { hit = Math.max(hit, -vn); d.vx -= (1 + bounce) * vn * nx; d.vy -= (1 + bounce) * vn * ny; }
  }
  return hit;
}
/** Is the puck all the way into a net? Returns the team whose net it is (0 = Red's, at -x), or -1. */
const inNet = (p) => (Math.abs(p.x) > GL + CONFIG.puckR && Math.abs(p.x) < GL + GD && Math.abs(p.y) < GW ? (p.x > 0 ? 1 : 0) : -1);
// Faceoff spots for the skaters, seen from Red's side (Red attacks +x); Blue's are turned round.
const SPOTS = [[-70, 0], [-170, -150], [-170, 150]];
function spotOf(team, i) { const s = SPOTS[i] || [-260, 0], f = team === 0 ? 1 : -1; return { x: s[0] * f, y: s[1] * f, f: team === 0 ? 0 : Math.PI }; }
const goalieHome = (team) => ({ x: (team === 0 ? -1 : 1) * (GL - 20), y: 0, f: team === 0 ? 0 : Math.PI });

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
/** Skate body s toward input (ix, iy) (rink directions, length up to 1) at `share` of top speed. */
function skate(s, ix, iy, dt, share, now) {
  const stunned = s.stun > now, len = stunned ? 0 : Math.hypot(ix, iy);
  const top = CONFIG.skate * share * (s.carry ? CONFIG.carrySlow : 1) + (s.checkT > now ? CONFIG.checkSpeed : 0);
  if (len > 0.05) {
    const along = (s.vx * ix + s.vy * iy) / len, k = along < 0 ? CONFIG.turnBrake : 1; // pushing against your slide: a hard stop
    s.vx += (ix / len) * Math.min(1, len) * CONFIG.accel * k * dt; s.vy += (iy / len) * Math.min(1, len) * CONFIG.accel * k * dt;
    s.f += wrapA(Math.atan2(iy, ix) - s.f) * Math.min(1, 12 * dt);
    s.spray = along < -120;
  } else { const f = Math.exp(-(stunned ? CONFIG.stunBrake : CONFIG.glide) * dt); s.vx *= f; s.vy *= f; s.spray = stunned && Math.hypot(s.vx, s.vy) > 120; }
  const sp = Math.hypot(s.vx, s.vy); if (sp > top) { const k = Math.max(top / sp, 1 - 4 * dt); s.vx *= k; s.vy *= k; }
  s.x += s.vx * dt; s.y += s.vy * dt;
  keepInRink(s, CONFIG.skaterR, 0.4); hitNets(s, CONFIG.skaterR, 0.2);
}
/** Where a skater's stick blade is. */
const stickOf = (s, reach = CONFIG.stickReach) => ({ x: s.x + Math.cos(s.f) * reach, y: s.y + Math.sin(s.f) * reach });
/** Move a puck-sized point from a toward b in short steps that stop at the boards and the nets' walls. */
function slideTo(a, b) {
  const p = { x: a.x, y: a.y, vx: 0, vy: 0 }, n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 6));
  for (let i = 0; i < n; i++) { p.x += (b.x - a.x) / n; p.y += (b.y - a.y) / n; hitNets(p, CONFIG.puckR, 0); keepInRink(p, CONFIG.puckR, 0); }
  return { x: p.x, y: p.y };
}
/** Where a carried puck sits: on the blade, but never through the boards or through a net's side or back. */
const bladeSpot = (s) => slideTo(s, stickOf(s));
/** Push body a out of body b (skaters bump). */
function bump(a, b, min) {
  const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
  if (d >= min || d < 1e-3) return false;
  a.x += (dx / d) * (min - d) * 0.5; a.y += (dy / d) * (min - d) * 0.5;
  return true;
}
/** Move a loose puck dt seconds against the boards, nets and `goalies`. Returns { goalie: the goalie it bounced off, board, post, goal: the team whose net it's in, or -1 }. */
function stepPuck(p, dt, goalies) {
  const out = { goalie: null, board: 0, post: 0, goal: -1 }, r = CONFIG.puckR;
  const n = Math.max(1, Math.ceil((Math.hypot(p.vx, p.vy) * dt) / 6));
  for (let i = 0; i < n; i++) {
    p.x += (p.vx * dt) / n; p.y += (p.vy * dt) / n;
    for (const g of goalies) {
      const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy), min = r + CONFIG.goalieR;
      if (d >= min || d < 1e-3) continue;
      const nx = dx / d, ny = dy / d, vn = p.vx * nx + p.vy * ny;
      p.x = g.x + nx * min; p.y = g.y + ny * min;
      if (vn < 0) { p.vx -= 1.45 * vn * nx; p.vy -= 1.45 * vn * ny; out.goalie = g; } // a save: pads soak up some speed
    }
    out.post = Math.max(out.post, hitNets(p, r, 0.55));
    out.board = Math.max(out.board, keepInRink(p, r, CONFIG.boardBounce));
    const goal = inNet(p); if (goal >= 0) { out.goal = goal; break; }
  }
  const sp = Math.hypot(p.vx, p.vy), cap = sp > CONFIG.maxPuck ? CONFIG.maxPuck / sp : 1, f = Math.exp(-CONFIG.puckFriction * dt) * cap;
  p.vx *= f; p.vy *= f;
  if (Math.abs(p.vx) + Math.abs(p.vy) < 3) p.vx = p.vy = 0;
  return out;
}
/** Can skater s pick up a loose puck p right now? (its blade, or its body, touches it) */
function canPick(s, p, now) {
  if (s.stun > now || s.noPick > now) return false;
  const st = stickOf(s);
  return Math.hypot(p.x - st.x, p.y - st.y) < CONFIG.stickR + CONFIG.puckR || Math.hypot(p.x - s.x, p.y - s.y) < CONFIG.skaterR + CONFIG.puckR;
}
/** The puck's velocity for a shot by s with `charge` (0..1) toward the net of team `target`: bent toward the net when roughly on target. */
function shotVel(s, charge, target) {
  const speed = CONFIG.shotMin + (CONFIG.shotMax - CONFIG.shotMin) * clamp(charge, 0, 1);

function rounded(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const SCRATCH = (() => { let a = 7; const rnd = () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; return Array.from({ length: 70 }, () => [(rnd() - 0.5) * 2 * HL, (rnd() - 0.5) * 2 * HW, 40 + rnd() * 160, rnd() * Math.PI * 2]); })();

// Sounds, made on the fly with WebAudio (no files).
let audio = null, noise = null;
function unlockAudio() {

  try { audio = new AudioContext(); noise = audio.createBuffer(1, audio.sampleRate * 1.2, audio.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch {}
}

  gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.001, t + len);

}

function sfx(kind, power = 1) {
  if (!audio) return;

  if (kind === "slap") { tone("square", 260, 80, 0.1, 0.2); hiss(0.12, 0.4, 2200); }
  if (kind === "save") tone("sine", 220, 120, 0.12, 0.25);
  if (kind === "board") tone("sine", 140, 70, 0.14, 0.08 + power * 0.25);
  if (kind === "post") { tone("square", 1200, 1180, 0.25, 0.08); tone("sine", 1800, 1790, 0.3, 0.06); }
  if (kind === "check") { tone("sawtooth", 120, 50, 0.18, 0.25); hiss(0.15, 0.3, 700); }
  if (kind === "whoosh") hiss(0.18, 0.12, 1600);
  if (kind === "horn") { tone("sawtooth", 196, 190, 1.1, 0.16); tone("sawtooth", 247, 240, 1.1, 0.12); tone("sawtooth", 294, 290, 1.1, 0.1); }
  if (kind === "whistle") { tone("sine", 2400, 2350, 0.16, 0.12); tone("sine", 2400, 2300, 0.32, 0.12, 0.22); }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, boardFor = -1, msgUntil = 0, dropped = false;
const seen = { score: "", id: -1, ko: -1, phase: "", period: 0 };
const startedAt = performance.now();
const PERIOD_NAMES = ["", "1st", "2nd", "3rd"];
function nameOf(id) {
  if (!id) return "Someone";
  if (id === net.sessionId) return myName;
  if (isGoalie(id)) return GOALIE_NAMES[+id[1]];
  if (isBot(id)) return BOT_NAMES[+id.slice(1)] || "Bot";
  return String((S.entities.players[id] || {}).n || "Player");
}
function say(html, ms) { $("msg").innerHTML = html; msgUntil = performance.now() + ms; }
function hud(g, now) {
  const team = teamOf(g, net.sessionId), t = Date.now(), score = g.score.join("-");
  if (seen.id === g.id && score !== seen.score && g.last) { // a goal: shown from the state, so everyone sees it
    const L = g.last, side = 1 - L.t, gx = (side === 1 ? 1 : -1) * (GL + GD / 2);
    sparks(gx, 0, TEAM_COLORS[L.t], 50, 520, 0.9, 7); sparks(gx, 0, "#ffffff", 24, 400, 0.7); shake = 16; lamps[side] = 1;
    const who = !L.id ? `for ${TEAM_NAMES[L.t]}` : (L.id === net.sessionId ? "You" : esc(L.n)) + (L.own ? " scored on their own net!" : ` for ${TEAM_NAMES[L.t]}`);
    say(`<span style="color:${TEAM_COLORS[L.t]}">GOAL!</span><small>${who}</small>`, CONFIG.goalMs - 300); sfx("horn");
  }
  if (seen.id === g.id && g.phase === "break" && seen.phase !== "break") { say(g.golden ? `<span style="color:#ffd166">OVERTIME</span><small>Next goal wins</small>` : `END OF ${PERIOD_NAMES[g.period] || ""}<small>${TEAM_NAMES[0]} ${g.score[0]} – ${g.score[1]} ${TEAM_NAMES[1]}</small>`, CONFIG.breakMs - 200); sfx("whistle"); }
  if (g.ko !== seen.ko && g.phase === "play") sfx("whistle");
  if (g.phase === "over" && seen.phase !== "over") { say(g.win >= 0 ? `<span style="color:${TEAM_COLORS[g.win]}">FINAL</span>` : "FINAL", 1500); sfx("horn"); }
  if (seen.id !== g.id) msgUntil = 0;
  Object.assign(seen, { score, id: g.id, ko: g.ko, phase: g.phase, period: g.period });
  $("msg").classList.toggle("on", now < msgUntil);
  $("s0").textContent = g.score[0]; $("s1").textContent = g.score[1];
  $("s0").classList.toggle("me", team === 0); $("s1").classList.toggle("me", team === 1);
  const left = g.phase === "goal" || g.phase === "break" ? g.left : Math.max(0, Math.min(CONFIG.periodMs, g.endsAt - Math.max(t, g.kickAt))), sec = Math.ceil(left / 1000);
  $("clock").innerHTML = g.phase === "over" ? "FINAL" : g.golden ? "OT<small>NEXT GOAL WINS</small>" : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}<small>${PERIOD_NAMES[g.period] || ""} PERIOD</small>`;
  $("clock").classList.toggle("ot", !!g.golden);
  if (ATTRACT) { $("score").hidden = true; $("hint").textContent = $("net").textContent = ""; return; }
  $("hint").textContent = team < 0 ? "Both teams are full. You're in the next game." : touchUI ? `You're ${TEAM_NAMES[team]}. Drag to skate · hold SHOOT, let go to fire · PASS · CHECK. Score on the ${wide ? "right" : "top"}.` : `You're ${TEAM_NAMES[team]}. WASD/arrows skate · hold Space to charge a shot · X pass · C check. Score on the ${wide ? "right" : "top"}.`;
  $("hint").style.opacity = now - startedAt < 9000 || team < 0 ? 1 : 0;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the puck and bots" : ""}`;
  const card = g.phase === "over" && t > g.overAt - CONFIG.resultsMs + 1500;
  $("over").hidden = !card;
  if (card) {
    const won = team >= 0 && g.win === team;
    $("winner").textContent = won ? "You win!" : g.win >= 0 ? `${TEAM_NAMES[g.win]} wins!` : "A draw";
    $("winner").style.color = g.win >= 0 ? TEAM_COLORS[g.win] : "#fff";
    $("final").innerHTML = `<span style="color:${TEAM_COLORS[0]}">${TEAM_NAMES[0]}</span> ${g.score[0]} – ${g.score[1]} <span style="color:${TEAM_COLORS[1]}">${TEAM_NAMES[1]}</span>`;
    const scorers = Object.entries(g.goals || {}).sort((a, b) => b[1][0] - a[1][0]);
    $("scorers").innerHTML = scorers.length ? scorers.map(([id, [n, name]]) => `<li class="${id === net.sessionId ? "me" : ""}">${esc(id === net.sessionId ? "You" : name)}<span>${n}</span></li>`).join("") : `<li class="note">Nobody scored.</li>`;
    $("again").hidden = team < 0;
    $("again").textContent = myReady === g.id ? "Waiting for the others…" : "Play again";
    $("next").textContent = `Next game in ${Math.max(0, Math.ceil((g.overAt - t) / 1000))}s`;
    if (boardFor !== g.id) { boardFor = g.id; showBoard(((g.goals || {})[net.sessionId] || [0])[0]); }
  }
}
function showBoard(myGoals) {
  const list = $("board");
  if (!board) { list.innerHTML = `<li class="note">Leaderboards need a connection.</li>`; return; }
  list.innerHTML = `<li class="note">Loading…</li>`;
  (myGoals > 0 ? board.submit(myGoals, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : `<li class="note">No goals yet. Be the first.</li>`;
  }).catch(() => { list.innerHTML = `<li class="note">Couldn't load the leaderboard.</li>`; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c)); // bots wear plain team helmets, so only people's colors count
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const keys = new Set();
let joy = null; // the thumb stick: { id, ox, oy, x, y } in screen px
/** Where I want to skate, in rink directions: the keys or the thumb stick, turned from screen to rink by the view. */
function myInput() {
  if (ATTRACT) return [0, 0];
  let u = (keys.has("arrowright") || keys.has("d") ? 1 : 0) - (keys.has("arrowleft") || keys.has("a") ? 1 : 0);
  let v = (keys.has("arrowdown") || keys.has("s") ? 1 : 0) - (keys.has("arrowup") || keys.has("w") ? 1 : 0);
  if (joy) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy); u = d > 6 ? (dx / d) * Math.min(1, d / 46) : 0; v = d > 6 ? (dy / d) * Math.min(1, d / 46) : 0; }
  const l = Math.hypot(u, v); if (l > 1) { u /= l; v /= l; }
  return [M[0] * u + M[2] * v, M[1] * u + M[3] * v];
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); unlockAudio();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  keys.add(k);
  if (e.repeat) return;
  if (k === " " || k === "k") act.shoot = true;
  if (k === "x" || k === "shift" || k === "l") act.pass = true;
  if (k === "c" || k === "j") act.check = true;
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); keys.delete(k); if (k === " " || k === "k") act.shoot = false; });
addEventListener("blur", () => { keys.clear(); act.shoot = false; });
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse") { act.shoot = true; return; } // a mouse click shoots too
  if (!joy) { joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-click shoots too, without the menu
cv.addEventListener("pointermove", (e) => { if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerType === "mouse") act.shoot = false; if (joy && e.pointerId === joy.id) joy = null; });
$("pad").hidden = !touchUI;
for (const [id, down, up] of [["bShoot", () => (act.shoot = true), () => (act.shoot = false)], ["bPass", () => (act.pass = true), null], ["bCheck", () => (act.check = true), null]]) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); b.setPointerCapture(e.pointerId); b.classList.add("on"); down(); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { b.classList.remove("on"); if (up) up(); });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the game meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncViews(dt);
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(dt, g, now);
    draw(g, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("grab", (msg, from) => { if (isHost() && msg) applyGrab(msg, from); });
  net.on("shot", (msg, from) => { if (isHost() && msg) applyShot(msg, from); else if (msg) shotFx(+msg.x, +msg.y, Math.hypot(+msg.vx, +msg.vy)); });
  net.on("check", (msg, from) => { if (isHost() && msg && msg.g === game()?.id) applyCheck(from, msg.to); });
  net.on("fx", (msg, from) => { if (!isHost() && msg && from === livePlayers()[0]) fxFromHost(msg); });
  net.on("knock", (msg, from) => { // only the host knocks people, and never harder than a check
    if (!msg || msg.to !== net.sessionId || from !== livePlayers()[0]) return;
    const vx = +msg.vx || 0, vy = +msg.vy || 0, k = Math.min(1, CONFIG.knock / (Math.hypot(vx, vy) || 1)); knocked(vx * k, vy * k);
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { goalMs: 1400, faceoffMs: 400, periodMs: 1e9, botShootRange: 520, botSpeed: 0.95, goalieError: 30, goalieSpeed: 220 });
  requestAnimationFrame(frame);
})();
